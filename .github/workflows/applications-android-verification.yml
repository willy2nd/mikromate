name: MikroMate Applications and Android Verification

on:
  push:
    branches:
      - applications-api-mainline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mikromate
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mikromate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mikromate -d mikromate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mikromate:test-password@localhost:5432/mikromate_test
      JWT_SECRET: integration-test-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install backend dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check worker-capacity.js
      - name: Run PostgreSQL-backed API integration tests
        run: npm test

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build MikroMate debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikroMate-applications-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
