name: MikroMate Applications Backend Checks

on:
  push:
    branches:
      - applications-api-mainline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mikromate
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mikromate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mikromate -d mikromate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mikromate:test-password@localhost:5432/mikromate_test
      JWT_SECRET: integration-test-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check worker-capacity.js
      - name: Run PostgreSQL-backed API integration tests
        run: npm test
