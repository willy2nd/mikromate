name: MikroMate Android Release Build

on:
  push:
    branches:
      - poster-applications-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install backend dependencies
        run: npm install

      - name: Run backend regression tests
        run: npm test

  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build MikroMate PR debug APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Build MikroMate release APK
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Decode Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mikromate-release.jks"
          test -s "$RUNNER_TEMP/mikromate-release.jks"

      - name: Sign MikroMate Release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mikromate-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/mikromate-release.apk \
            "$UNSIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            app/build/outputs/apk/release/mikromate-release.apk

      - name: Upload Signed MikroMate APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MikroMate-release-APK
          path: app/build/outputs/apk/release/mikromate-release.apk

      - name: Upload installable PR debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MikroMate-pr-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
