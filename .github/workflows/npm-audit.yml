
name: MikroMate npm security audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - '.github/workflows/npm-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install dependencies and create lockfile
        run: npm install --ignore-scripts

      - name: Show installed package versions
        run: npm ls --depth=0 || true

      - name: Report security vulnerabilities
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); console.log('SUMMARY:',JSON.stringify(r.metadata?.vulnerabilities ?? r.error)); for (const [n,v] of Object.entries(r.vulnerabilities ?? {})) console.log('\nPACKAGE:',n,'\nSEVERITY:',v.severity,'\nAFFECTED:',v.range,'\nFIX:',JSON.stringify(v.fixAvailable),'\nDETAILS:',JSON.stringify(v.via))"

      - name: Save full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikromate-npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
